apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/app
patches:
  - target:
      kind: Deployment
      name: default-deployment
    patch: |-
      - op: replace
        path: /metadata/name
        value: kafka-app-deployment
      - op: replace
        path: /metadata/namespace
        value: default
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/selector/matchLabels/app
        value: kafka-app
      - op: replace
        path: /spec/template/metadata/labels/app
        value: kafka-app
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: kafka-container
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1024Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2048Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: mrdevopsman/kafka-spring-app:1.0.3
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: KAFKA_BROKER
            value: kafka:9092
          - name: LOGGING_LEVEL_ROOT
            value: DEBUG
          - name: SPRING_KAFKA_PRODUCER_SECURITY_PROTOCOL
            value: PLAINTEXT
          - name: SPRING_KAFKA_CONSUMER_SECURITY_PROTOCOL
            value: PLAINTEXT
  - target:
      kind: Service
      name: default-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: kafka-app-service
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
      - op: replace
        path: /spec/selector/app
        value: kafka-app
  - target:
      kind: Ingress
      name: default-ingress
    patch: |-
      - op: replace
        path: /metadata/name
        value: kafka-app-ingress
      - op: replace
        path: /metadata/namespace
        value: default
      - op: replace
        path: /spec/rules/0/host
        value: kafka.example
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: kafka-app-service
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/number
        value: 8080
      - op: add
        path: /metadata/annotations
        value:
          nginx.ingress.kubernetes.io/rewrite-target: /
